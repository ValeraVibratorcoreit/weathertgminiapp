<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Прогноз погоды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-from: #3b82f6;
            --card-to: #4f46e5;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-tertiary: rgba(255, 255, 255, 0.6);
            --card-overlay: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            margin: 0 auto;
            transition: transform 0.3s ease;
        }
        
        @media screen and (max-width: 420px) {
            body {
                padding: 8px;
            }
            
            .card {
                margin-bottom: 12px;
            }
            
            .weather-details {
                gap: 8px;
                padding: 12px;
            }
            
            .temp {
                font-size: 48px;
            }
            
            .forecast-day-item {
                min-width: 70px;
            }
        }
        
        @media screen and (max-width: 320px) {
            body {
                padding: 6px;
            }
            
            .temp {
                font-size: 42px;
            }
            
            .temp-unit {
                font-size: 20px;
            }
            
            .detail-value {
                font-size: 14px;
            }
            
            .city {
                font-size: 16px;
            }
            
            .forecast-day-item {
                min-width: 65px;
                padding: 8px 4px;
            }
        }
        
        .card {
            width: 100%;
            background: linear-gradient(to bottom, var(--card-from), var(--card-to));
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.25);
        }
        
        .card-pattern {
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%221%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%2016.2A4.5%204.5%200%200017.5%208h-1.8A7%207%200%104%2014.9%22%2F%3E%3Cpath%20d%3D%22M12%2012v9%22%2F%3E%3Cpath%20d%3D%22M8%2017l4%204%22%2F%3E%3Cpath%20d%3D%22M16%2017l-4%204%22%2F%3E%3C%2Fsvg%3E');
            background-position: center;
            opacity: 0.05;
        }
        
        .card-content {
            position: relative;
            padding: 16px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .location {
            display: flex;
            flex-direction: column;
        }
        
        .city {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .date {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .time {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .temp-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
        }
        
        .temp-display {
            display: flex;
            align-items: flex-start;
        }
        
        .temp {
            font-size: 56px;
            font-weight: 700;
            line-height: 1;
            color: var(--text-primary);
        }
        
        .temp-unit {
            font-size: 24px;
            color: var(--text-secondary);
            margin-top: 4px;
            margin-left: 2px;
        }
        
        .weather-icon-container {
            position: relative;
        }
        
        .icon-glow {
            position: absolute;
            inset: -16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            filter: blur(16px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .card:hover .icon-glow {
            opacity: 0.75;
        }
        
        .weather-icon {
            position: relative;
            width: 64px;
            height: 64px;
            color: var(--text-primary);
        }
        
        .description {
            font-size: 15px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-align: left;
        }
        
        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            background: var(--card-overlay);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        
        @media screen and (max-width: 400px) {
            .weather-details {
                grid-template-columns: 1fr; /* Одна колонка на узких экранах */
                gap: 12px; /* Увеличиваем отступ между элементами */
            }
            .detail {
                flex-direction: row; /* Элементы в строке */
                align-items: center; /* Выравнивание по центру */
                justify-content: space-between; /* Растягивание по ширине */
                padding: 8px 0;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* Разделитель */
            }
            .detail:last-child {
                border-bottom: none;
            }
            .detail-label {
                margin-bottom: 0;
            }
        }
        
        .detail {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .detail-icon {
            width: 24px;
            height: 24px;
            color: var(--text-secondary);
        }
        
        .detail-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .detail-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .section-title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-align: left;
            width: 100%;
        }
        
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        
        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-overlay);
            border-radius: 12px;
            padding: 12px 16px;
            backdrop-filter: blur(4px);
        }
        
        .forecast-day {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .forecast-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .forecast-icon {
            width: 24px;
            height: 24px;
            color: var(--text-primary);
        }
        
        .forecast-temps {
            display: flex;
            gap: 8px;
        }
        
        .forecast-temp-low {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .forecast-temp-high {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .daylight-container {
            margin-top: 16px;
            width: 100%;
        }
        
        .daylight-diagram {
            position: relative;
            width: 100%;
            height: 120px;
            margin-top: 16px;
        }
        
        .daylight-arc {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-top: 2px dashed var(--card-overlay);
            border-radius: 50% 50% 0 0;
        }
        
        .earth-icon {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            opacity: 0.8;
        }
        
        .sun-icon {
            position: absolute;
            width: 24px;
            height: 24px;
            color: var(--text-primary);
        }
        
        .sunrise-time, .sunset-time {
            position: absolute;
            bottom: -25px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .sunrise-time {
            left: 10px;
        }
        
        .sunset-time {
            right: 10px;
        }
        
        .daylight-time {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 24px;
        }
        
        .additional-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 24px;
        }
        
        .info-item {
            background: var(--card-overlay);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        
        .info-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .forecast-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            width: 100%;
        }
        
        .forecast-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .forecast-tab {
            padding: 8px 16px;
            background: var(--card-overlay);
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        
        .forecast-tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
        }
        
        .forecast-scroll {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            margin-top: 16px;
        }
        
        .forecast-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .forecast-days {
            display: flex;
            padding: 8px 0;
            min-width: max-content;
        }
        
        .forecast-day-item {
            flex: 0 0 auto;
            text-align: center;
            padding: 10px 6px;
            min-width: 75px;
            background: var(--card-overlay);
            margin-right: 10px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
        }
        
        .forecast-day-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .forecast-day-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .forecast-day-icon {
            width: 40px;
            height: 40px;
            margin: 8px auto;
        }
        
        .forecast-day-temp {
            font-size: 16px;
            font-weight: 500;
        }
        
        .forecast-day-temp-night {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .location-btn {
            background-color: var(--card-from);
            color: var(--text-primary);
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        
        .location-btn:hover {
            background-color: var(--card-to);
            transform: translateY(-2px);
        }
        
        .loading {
            display: none;
            margin: 40px auto;
        }
        
        .loading:after {
            content: " ";
            display: block;
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border-radius: 50%;
            border: 4px solid var(--card-from);
            border-color: var(--card-from) transparent var(--card-from) transparent;
            animation: loading 1.2s linear infinite;
        }
        
        @keyframes loading {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            display: none;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="location-btn" id="getLocation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z"></path>
            </svg>
            Поделиться местоположением
        </button>

        <div class="loading" id="loading"></div>
        <div class="error-message" id="errorMessage"></div>

        <div id="weatherContent" style="display: none;">
            <!-- Основная карточка погоды -->
            <div class="card">
                <div class="card-pattern"></div>
                <div class="card-content">
                    <div class="card-header">
                        <div class="location">
                            <h3 class="city" id="city">Загрузка...</h3>
                            <p class="date" id="date"></p>
                        </div>
                        <span class="time" id="currentTime"></span>
                    </div>

                    <div class="temp-container">
                        <div class="temp-display">
                            <span class="temp" id="temp">--</span>
                            <span class="temp-unit">°C</span>
                        </div>

                        <div class="weather-icon-container">
                            <div class="icon-glow"></div>
                            <img class="weather-icon" id="weatherIcon" src="" alt="Погода">
                        </div>
                    </div>

                    <div class="description" id="description">Загрузка...</div>

                    <div class="weather-details">
                        <div class="detail">
                            <svg class="detail-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path>
                            </svg>
                            <span class="detail-label">Влажность</span>
                            <span class="detail-value" id="humidity">--%</span>
                        </div>

                        <div class="detail">
                            <svg class="detail-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z"></path>
                            </svg>
                            <span class="detail-label">Ветер</span>
                            <span class="detail-value" id="wind">-- м/с</span>
                        </div>

                        <div class="detail">
                            <svg class="detail-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path>
                            </svg>
                            <span class="detail-label">УФ-индекс</span>
                            <span class="detail-value" id="uvIndex">--</span>
                        </div>
                    </div>

                    <div class="forecast-section">
                        <h4 class="section-title">Прогноз на 3 дня</h4>
                        <div class="forecast-list" id="forecast">
                            <!-- Прогноз будет добавлен через JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Карточка с прогнозом на 10 дней -->
            <div class="card">
                <div class="card-pattern"></div>
                <div class="card-content">
                    <h4 class="section-title">Прогноз на 10 дней</h4>

                    <div class="forecast-tabs">
                        <div class="forecast-tab active">Подробный прогноз</div>
                        <div class="forecast-tab">На месяц</div>
                    </div>

                    <div class="forecast-scroll">
                        <div class="forecast-days" id="forecastDays">
                            <!-- Прогноз на 10 дней будет добавлен через JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Карточка со световым днем -->
            <div class="card">
                <div class="card-pattern"></div>
                <div class="card-content">
                    <h4 class="section-title">Световой день</h4>

                    <div class="daylight-time" id="daylightTime">-- ч -- мин</div>

                    <div class="daylight-diagram">
                        <div class="daylight-arc"></div>
                        <img class="earth-icon" src="https://cdn-icons-png.flaticon.com/512/616/616616.png" alt="Земля">

                        <svg class="sun-icon" style="left: 10px; bottom: 10px;" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"></path>
                        </svg>

                        <svg class="sun-icon" style="right: 10px; bottom: 10px;" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"></path>
                        </svg>

                        <div class="sunrise-time" id="sunriseTime">--:--</div>
                        <div class="sunset-time" id="sunsetTime">--:--</div>
                    </div>

                    <div class="additional-info">
                        <div class="info-item">
                            <div class="info-label">Фаза луны</div>
                            <div class="info-value" id="moonPhase">Растущая</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Магнитное поле</div>
                            <div class="info-value" id="magneticField">Спокойное</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Давление</div>
                            <div class="info-value" id="pressure">-- мм</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready(); // Сообщаем Telegram WebApp, что приложение готово к отображению

        // Настройка внешнего вида приложения в соответствии с темой Telegram
        document.documentElement.style.setProperty('--bg-color', tg.themeParams.bg_color || '#121212');
        document.documentElement.style.setProperty('--text-primary', tg.themeParams.text_color || '#ffffff');
        document.documentElement.style.setProperty('--text-secondary', tg.themeParams.hint_color || 'rgba(255, 255, 255, 0.8)');
        document.documentElement.style.setProperty('--card-from', tg.themeParams.button_color || '#3b82f6');
        document.documentElement.style.setProperty('--card-to', tg.themeParams.button_text_color || '#4f46e5');

        // Глобальная переменная для хранения данных о погоде
        window.weatherData = null;

        // Элементы DOM
        const loadingEl = document.getElementById('loading');
        const weatherContentEl = document.getElementById('weatherContent');
        const errorMessageEl = document.getElementById('errorMessage');
        const getLocationBtn = document.getElementById('getLocation');

        // Форматирование даты
        function formatDate(date) {
            const options = { day: 'numeric', month: 'long' };
            return date.toLocaleDateString('ru-RU', options);
        }

        // Форматирование времени
        function formatTime(date) {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        // Установка текущей даты и времени
        const currentDate = new Date();
        document.getElementById('date').textContent = formatDate(currentDate);
        document.getElementById('currentTime').textContent = formatTime(currentDate);

        // Обновление времени каждую минуту
        setInterval(() => {
            const now = new Date();
            document.getElementById('currentTime').textContent = formatTime(now);
        }, 60000);

        document.getElementById('getLocation').addEventListener('click', () => {
            if (navigator.geolocation) {
                showLoading();
                hideError();
                navigator.geolocation.getCurrentPosition(successCallback, errorCallback);
            } else {
                showError('Геолокация не поддерживается вашим браузером');
            }
        });

        function successCallback(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            fetchForecast(lat, lon);
        }

        function errorCallback(error) {
            hideLoading();
            showError('Ошибка при получении местоположения: ' + error.message);
        }

        function fetchForecast(lat, lon) {
            const params = new URLSearchParams({
                latitude: lat,
                longitude: lon,
                current_weather: true,
                daily: 'weathercode,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,daylight_duration,precipitation_sum',
                hourly: 'temperature_2m,relativehumidity_2m,weathercode,surface_pressure,is_day',
                forecast_days: 10,
                timezone: 'auto',
                windspeed_unit: 'ms'
            });
            const url = `https://api.open-meteo.com/v1/forecast?${params.toString()}`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Полученные данные Open-Meteo:', data); // Отладка
                    window.weatherData = data;

                    displayCurrentWeatherOpenMeteo(data);
                    displayForecastOpenMeteo(data.daily);
                    displayExtendedForecastOpenMeteo(data.daily);
                    
                    if (data.daily && data.daily.sunrise && data.daily.sunset && data.daily.daylight_duration) {
                        displaySunriseSunsetOpenMeteo(data.daily.sunrise[0], data.daily.sunset[0], data.daily.daylight_duration[0]);
                    }
                    if (data.daily && data.daily.uv_index_max) {
                        displayUVIndexOpenMeteo(data.daily.uv_index_max[0]);
                    }
                    
                    hideLoading();
                    weatherContentEl.style.display = 'block';
                    getLocationBtn.style.display = 'none'; 
                })
                .catch(error => {
                    console.error('Ошибка получения прогноза Open-Meteo:', error);
                    hideLoading();
                    showError('Ошибка при получении данных о прогнозе погоды. Попробуйте позже.');
                });
        }

        // Вспомогательные функции для Open-Meteo
        function getWeatherDescriptionOpenMeteo(code) {
            const descriptions = {
                0: 'Ясно',
                1: 'В основном ясно',
                2: 'Переменная облачность',
                3: 'Пасмурно',
                45: 'Туман',
                48: 'Изморозь',
                51: 'Морось: легкая',
                53: 'Морось: умеренная',
                55: 'Морось: сильная',
                56: 'Ледяная морось: легкая',
                57: 'Ледяная морось: сильная',
                61: 'Дождь: слабый',
                63: 'Дождь: умеренный',
                65: 'Дождь: сильный',
                66: 'Ледяной дождь: слабый',
                67: 'Ледяной дождь: сильный',
                71: 'Снег: слабый',
                73: 'Снег: умеренный',
                75: 'Снег: сильный',
                77: 'Снежные зерна',
                80: 'Ливень: слабый',
                81: 'Ливень: умеренный',
                82: 'Ливень: сильный',
                85: 'Снегопад: слабый',
                86: 'Снегопад: сильный',
                95: 'Гроза: слабая или умеренная',
                96: 'Гроза с градом: слабая',
                99: 'Гроза с градом: сильная'
            };
            return descriptions[code] || 'Нет данных';
        }

        function getWeatherIconOpenMeteo(code, isDay = true) {
            // Простое сопоставление с несколькими SVG иконками (можно расширить)
            // Используем существующие классы и структуру, но src будет data URI или путь к локальному SVG
            // Для простоты пока будем возвращать текстовую иконку или emoji, 
            // так как вставка множества SVG через edit_file затруднительна.
            // Или используем очень базовые SVG, которые уже есть.

            // Пример использования текстовых эмодзи:
            if (code === 0) return isDay ? '☀️' : '🌙'; // Ясно
            if (code >= 1 && code <= 3) return '☁️'; // Облачно
            if (code === 45 || code === 48) return '🌫️'; // Туман
            if (code >= 51 && code <= 67) return '🌧️'; // Дождь/Морось
            if (code >= 71 && code <= 77) return '❄️'; // Снег
            if (code >= 80 && code <= 82) return '🌦️'; // Ливень
            if (code >= 85 && code <= 86) return '🌨️'; // Снегопад
            if (code >= 95 && code <= 99) return '⛈️'; // Гроза
            return '🌍'; // По умолчанию
        }
        
        // Обновленная функция отображения текущей погоды
        function displayCurrentWeatherOpenMeteo(data) {
            try {
                const current = data.current_weather;
                const daily = data.daily; // Для УФ

                // Город - OpenMeteo не дает имя, используем общее название или координаты
                document.getElementById('city').textContent = 'Текущее местоположение';

                // Температура
                const tempC = Math.round(current.temperature); // OpenMeteo current.temperature -> current_weather.temperature_2m (если hourly) или current_weather.temperature
                document.getElementById('temp').textContent = tempC;

                // Описание погоды
                document.getElementById('description').textContent = getWeatherDescriptionOpenMeteo(current.weathercode);

                // Влажность
                const humidity = current.relativehumidity_2m !== undefined ? current.relativehumidity_2m : '--';
                document.getElementById('humidity').textContent = `${humidity}%`;


                // Ветер (OpenMeteo current.windspeed -> current_weather.windspeed_10m, unit уже в м/с)
                const windSpeedMps = Math.round(current.windspeed);
                document.getElementById('wind').textContent = `${windSpeedMps} м/с`;

                // Давление
                const pressureHpa = current.surface_pressure !== undefined ? current.surface_pressure : 1013; // Default if missing, 1013 hPa is standard pressure
                const pressureMm = Math.round(pressureHpa * 0.750062);
                document.getElementById('pressure').textContent = `${pressureMm} мм`;

                // Иконка погоды
                // Заменяем src на текстовую иконку или data URI SVG
                const weatherIconEl = document.getElementById('weatherIcon');
                const iconText = getWeatherIconOpenMeteo(current.weathercode, current.is_day === 1);
                // Для img тега это не подойдет напрямую. Нужно либо менять img на span, либо генерировать SVG data URI.
                // Пока что просто скроем img и покажем текст в description
                weatherIconEl.style.display = 'none'; // Скрываем старый img тэг
                // Можно создать новый элемент для текстовой иконки или добавить к description
                // document.getElementById('description').textContent = `${iconText} ${getWeatherDescriptionOpenMeteo(current.weathercode)}`;
                // Лучше обновить иконку в .weather-icon-container каким-то образом
                const iconContainer = weatherIconEl.parentElement;
                let newIconEl = iconContainer.querySelector('.text-weather-icon');
                if (!newIconEl) {
                    newIconEl = document.createElement('span');
                    newIconEl.className = 'text-weather-icon';
                    newIconEl.style.fontSize = '56px';
                    iconContainer.appendChild(newIconEl);
                }
                newIconEl.textContent = iconText;


                // Обновляем фон в зависимости от погоды и времени суток
                updateBackgroundOpenMeteo(current.weathercode, current.is_day === 1);

            } catch (error) {
                console.error('Error displaying OpenMeteo current weather data:', error);
                showError('Ошибка при отображении данных о текущей погоде');
            }
        }

        // Обновленная функция для прогноза на 3 дня (кратко)
        function displayForecastOpenMeteo(dailyData) {
            const forecastEl = document.getElementById('forecast');
            forecastEl.innerHTML = '';

            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

            // OpenMeteo dailyData.time[0] - сегодня. Нам нужен прогноз со следующего дня, до 10 дней.
            // Отображаем 2 дня в этом блоке (завтра и послезавтра), как было раньше для краткого прогноза.
            for (let i = 1; i < Math.min(3, dailyData.time.length); i++) { // Оставляем 2 дня (i=1, i=2) для этого блока
                const forecastDate = new Date(dailyData.time[i]);
                let dayName;

                if (i === 1) {
                    dayName = 'Завтра';
                } else {
                    const dayOfWeek = days[forecastDate.getDay()];
                    const dayOfMonth = forecastDate.getDate();
                    const month = months[forecastDate.getMonth()];
                    dayName = `${dayOfWeek}, ${dayOfMonth} ${month}`;
                }

                const tempDay = Math.round(dailyData.temperature_2m_max[i]);
                const tempNight = Math.round(dailyData.temperature_2m_min[i]);
                
                const iconText = getWeatherIconOpenMeteo(dailyData.weathercode[i], true); // true для isDay, т.к. это дневной прогноз

                // Используем текстовую иконку
                const iconHtml = `<span class="forecast-icon" style="font-size: 24px;">${iconText}</span>`;


                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <span class="forecast-day">${dayName}</span>
                    <div class="forecast-right">
                        ${iconHtml}
                        <div class="forecast-temps">
                            <span class="forecast-temp-low">${tempNight}°</span>
                            <span class="forecast-temp-high">${tempDay}°</span>
                        </div>
                    </div>
                `;
                forecastEl.appendChild(forecastItem);
            }
        }

        // Обновленная функция для расширенного прогноза (карточки по дням)
        function displayExtendedForecastOpenMeteo(dailyData) {
    const forecastDaysEl = document.getElementById('forecastDays');
    forecastDaysEl.innerHTML = '';

            if (!dailyData || !dailyData.time || dailyData.time.length === 0) {
                console.error('Нет данных о прогнозе для displayExtendedForecastOpenMeteo');
        forecastDaysEl.innerHTML = '<div style="text-align: center; padding: 20px; color: white;">Нет данных о прогнозе</div>';
        return;
    }

    const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

            // Показываем прогноз на все доступные дни (до 10 дней, включая сегодняшний)
            dailyData.time.forEach((dateStr, i) => {
                if (i >= 10) return; // Показываем до 10 дней

                const forecastDate = new Date(dateStr);
                let dayName;

                const today = new Date();
                const tomorrow = new Date(today);
                tomorrow.setDate(tomorrow.getDate() + 1);

                if (forecastDate.toDateString() === today.toDateString()) {
            dayName = 'Сегодня';
                } else if (forecastDate.toDateString() === tomorrow.toDateString()) {
            dayName = 'Завтра';
        } else {
            dayName = days[forecastDate.getDay()];
        }

                const dateDisplayStr = `${forecastDate.getDate()} ${months[forecastDate.getMonth()]}`;
                const tempDay = Math.round(dailyData.temperature_2m_max[i]);
                const tempNight = Math.round(dailyData.temperature_2m_min[i]);
                
                const iconText = getWeatherIconOpenMeteo(dailyData.weathercode[i], true);
                // Используем текстовую иконку
                const iconHtml = `<span class="forecast-day-icon" style="font-size: 40px;">${iconText}</span>`;


        const forecastDayItem = document.createElement('div');
        forecastDayItem.className = 'forecast-day-item';
        forecastDayItem.innerHTML = `
            <div class="forecast-day-name">${dayName}</div>
                    <div class="forecast-day-date">${dateDisplayStr}</div>
                    ${iconHtml}
            <div class="forecast-day-temp">днём ${tempDay}°</div>
            <div class="forecast-day-temp-night">ночью ${tempNight}°</div>
        `;
        forecastDaysEl.appendChild(forecastDayItem);
            });

    if (forecastDaysEl.children.length === 0) {
        forecastDaysEl.innerHTML = '<div style="text-align: center; padding: 20px; color: white;">Не удалось отобразить прогноз</div>';
    }
}

        // Обновленная функция для восхода/заката
        function displaySunriseSunsetOpenMeteo(sunriseISO, sunsetISO, daylightDurationSeconds) {
            const sunriseDate = new Date(sunriseISO);
            const sunsetDate = new Date(sunsetISO);

            document.getElementById('sunriseTime').textContent = formatTime(sunriseDate);
            document.getElementById('sunsetTime').textContent = formatTime(sunsetDate);

            const daylightHours = Math.floor(daylightDurationSeconds / 3600);
            const daylightMinutes = Math.floor((daylightDurationSeconds % 3600) / 60);
            document.getElementById('daylightTime').textContent = `${daylightHours} ч ${daylightMinutes} мин`;

            // Фазу луны и магнитное поле Open-Meteo не предоставляет в этом запросе, оставляем заглушки
            const moonPhases = ['Новолуние', 'Растущая луна', 'Первая четверть', 'Растущая луна',
                               'Полнолуние', 'Убывающая луна', 'Последняя четверть', 'Убывающая луна'];
            const dayOfMonth = new Date().getDate(); // Упрощенная логика
            const moonPhaseIndex = Math.floor((dayOfMonth % 30) / 3.75);
            document.getElementById('moonPhase').textContent = moonPhases[moonPhaseIndex];
            document.getElementById('magneticField').textContent = 'Нет данных';
        }

        // Обновленная функция для УФ-индекса
        function displayUVIndexOpenMeteo(uvIndex) {
            let uvLevel = uvIndex !== null && uvIndex !== undefined ? Math.round(uvIndex) : 0;
            document.getElementById('uvIndex').textContent = uvLevel;
        }

        // Обновленная функция для фона
        function updateBackgroundOpenMeteo(weatherCode, isDay) {
            let gradientFrom, gradientTo;
            // WMO Codes: https://open-meteo.com/en/docs (Weather interpretation codes WMO_CODE_WW)
            if (isDay) {
                // Дневные градиенты
                if (weatherCode === 0) { // Ясно
                    gradientFrom = '#2193b0'; gradientTo = '#6dd5ed';
                } else if (weatherCode >= 1 && weatherCode <= 3) { // Облачно (1-ясно, 2-переменная, 3-пасмурно)
                    gradientFrom = '#4b79a1'; gradientTo = '#79c1f1';
                } else if (weatherCode === 45 || weatherCode === 48) { // Туман
                    gradientFrom = '#7f7fd5'; gradientTo = '#91eae4';
                } else if ((weatherCode >= 51 && weatherCode <= 57) || (weatherCode >= 61 && weatherCode <= 67) || (weatherCode >= 80 && weatherCode <= 82)) { // Морось, Дождь, Ливень
                     gradientFrom = '#3e5151'; gradientTo = '#a4b3b6';
                } else if ((weatherCode >= 71 && weatherCode <= 77) || (weatherCode >= 85 && weatherCode <= 86)) { // Снег
                    gradientFrom = '#8e9eab'; gradientTo = '#eef2f3';
                } else if (weatherCode >= 95 && weatherCode <= 99) { // Гроза
                    gradientFrom = '#2c3e50'; gradientTo = '#4ca1af';
                } else { // По умолчанию для дня
                    gradientFrom = '#4b79a1'; gradientTo = '#79c1f1';
                }
            } else {
                // Ночные градиенты
                if (weatherCode === 0) { // Ясно
                    gradientFrom = '#0f2027'; gradientTo = '#203a43';
                } else if (weatherCode >= 1 && weatherCode <= 3) { // Облачно
                    gradientFrom = '#232526'; gradientTo = '#414345';
                } else if (weatherCode === 45 || weatherCode === 48) { // Туман
                    gradientFrom = '#2c3e50'; gradientTo = '#3498db';
                } else if ((weatherCode >= 51 && weatherCode <= 57) || (weatherCode >= 61 && weatherCode <= 67) || (weatherCode >= 80 && weatherCode <= 82)) { // Морось, Дождь, Ливень
                    gradientFrom = '#1f1c2c'; gradientTo = '#4b6cb7';
                } else if ((weatherCode >= 71 && weatherCode <= 77) || (weatherCode >= 85 && weatherCode <= 86)) { // Снег
                    gradientFrom = '#243949'; gradientTo = '#517fa4';
                } else if (weatherCode >= 95 && weatherCode <= 99) { // Гроза
                    gradientFrom = '#0f0c29'; gradientTo = '#302b63';
                } else { // По умолчанию для ночи
                    gradientFrom = '#232526'; gradientTo = '#414345';
                }
            }

            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.style.background = `linear-gradient(to bottom, ${gradientFrom}, ${gradientTo})`;
            });
        }

        // Вспомогательные функции
        function showLoading() {
            loadingEl.style.display = 'block';
        }

        function hideLoading() {
            loadingEl.style.display = 'none';
        }

        function showError(message) {
            errorMessageEl.textContent = message;
            errorMessageEl.style.display = 'block';
        }

        function hideError() {
            errorMessageEl.style.display = 'none';
        }

        // Обработчики для вкладок прогноза
const forecastTabs = document.querySelectorAll('.forecast-tab');

forecastContent.id = 'monthly-forecast';
forecastContent.style.display = 'none';

forecastTabs.forEach((tab, index) => {

        if (index === 0) {

            document.getElementById('forecastDays').style.display = 'flex';

        } else {
            // На месяц - показываем сообщение о премиум-версии
            document.getElementById('forecastDays').style.display = 'none';

        }

});

// Функция для автоматического масштабирования контента под размер устройства
function adjustScale() {
    // Получаем размеры окна (в Telegram WebApp это может быть размер iframe)
    const windowWidth = window.innerWidth;
    const containerEl = document.querySelector('.container');
    
    // Настройка высоты для Telegram WebApp, если доступно
    if (tg && tg.viewportStableHeight) {
        // Устанавливаем минимальную высоту body равной стабильной высоте вьюпорта Telegram
        document.body.style.minHeight = tg.viewportStableHeight + 'px';
        // Убедимся, что контейнер занимает доступное пространство
        containerEl.style.maxWidth = '100%';
        containerEl.style.width = '100%';
    }
    
    // Дополнительные корректировки, если все еще нужно масштабировать на очень маленьких экранах
    // Хотя медиа-запросы должны справляться лучше, можно оставить небольшой запас
    // Базовый размер для дизайна (ширина контейнера из CSS)
    const baseWidth = 400;
    if (windowWidth < baseWidth) {
         const scale = windowWidth / baseWidth;
         const finalScale = Math.max(scale, 0.9); // Изменено минимальное значение масштаба
         containerEl.style.transform = `scale(${finalScale})`;
         containerEl.style.transformOrigin = 'top center';
         // Возможно, потребуется небольшая компенсация отступа снизу
         containerEl.style.marginBottom = `${(1 - finalScale) * 50}px`; // Уменьшено значение компенсации
    } else {
        containerEl.style.transform = 'none';
        containerEl.style.marginBottom = '0';
    }
}

// Вызываем функцию при загрузке
window.addEventListener('load', adjustScale);

// И при изменении размера окна
window.addEventListener('resize', adjustScale);
