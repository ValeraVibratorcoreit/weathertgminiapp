
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-from: #3b82f6;
            --card-to: #4f46e5;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-tertiary: rgba(255, 255, 255, 0.6);
            --card-overlay: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .card {
            width: 100%;
            background: linear-gradient(to bottom, var(--card-from), var(--card-to));
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.25);
        }
        
        .card-pattern {
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%221%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%2016.2A4.5%204.5%200%200017.5%208h-1.8A7%207%200%104%2014.9%22%2F%3E%3Cpath%20d%3D%22M12%2012v9%22%2F%3E%3Cpath%20d%3D%22M8%2017l4%204%22%2F%3E%3Cpath%20d%3D%22M16%2017l-4%204%22%2F%3E%3C%2Fsvg%3E');
            background-position: center;
            opacity: 0.05;
        }
        
        .card-content {
            position: relative;
            padding: 24px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .location {
            display: flex;
            flex-direction: column;
        }
        
        .city {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .date {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .time {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .temp-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
        }
        
        .temp-display {
            display: flex;
            align-items: flex-start;
        }
        
        .temp {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            color: var(--text-primary);
        }
        
        .temp-unit {
            font-size: 24px;
            color: var(--text-secondary);
            margin-top: 4px;
            margin-left: 2px;
        }
        
        .weather-icon-container {
            position: relative;
        }
        
        .icon-glow {
            position: absolute;
            inset: -16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            filter: blur(16px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .card:hover .icon-glow {
            opacity: 0.75;
        }
        
        .weather-icon {
            position: relative;
            width: 64px;
            height: 64px;
            color: var(--text-primary);
        }
        
        .description {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-align: left;
        }
        
        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 32px;
            background: var(--card-overlay);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        
        .detail {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .detail-icon {
            width: 24px;
            height: 24px;
            color: var(--text-secondary);
        }
        
        .detail-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-align: left;
            width: 100%;
        }
        
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        
        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-overlay);
            border-radius: 12px;
            padding: 12px 16px;
            backdrop-filter: blur(4px);
        }
        
        .forecast-day {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .forecast-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .forecast-icon {
            width: 24px;
            height: 24px;
            color: var(--text-primary);
        }
        
        .forecast-temps {
            display: flex;
            gap: 8px;
        }
        
        .forecast-temp-low {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .forecast-temp-high {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .daylight-container {
            margin-top: 16px;
            width: 100%;
        }
        
        .daylight-diagram {
            position: relative;
            width: 100%;
            height: 120px;
            margin-top: 16px;
        }
        
        .daylight-arc {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-top: 2px dashed var(--card-overlay);
            border-radius: 50% 50% 0 0;
        }
        
        .earth-icon {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            opacity: 0.8;
        }
        
        .sun-icon {
            position: absolute;
            width: 24px;
            height: 24px;
            color: var(--text-primary);
        }
        
        .sunrise-time, .sunset-time {
            position: absolute;
            bottom: -25px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .sunrise-time {
            left: 10px;
        }
        
        .sunset-time {
            right: 10px;
        }
        
        .daylight-time {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 24px;
        }
        
        .additional-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 24px;
        }
        
        .info-item {
            background: var(--card-overlay);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        
        .info-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .forecast-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            width: 100%;
        }
        
        .forecast-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .forecast-tab {
            padding: 8px 16px;
            background: var(--card-overlay);
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        
        .forecast-tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
        }
        
        .forecast-scroll {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            margin-top: 16px;
        }
        
        .forecast-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .forecast-days {
            display: flex;
            padding: 8px 0;
            min-width: max-content;
        }
        
        .forecast-day-item {
            flex: 0 0 auto;
            text-align: center;
            padding: 16px;
            min-width: 90px;
            background: var(--card-overlay);
            margin-right: 10px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
        }
        
        .forecast-day-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .forecast-day-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .forecast-day-icon {
            width: 40px;
            height: 40px;
            margin: 8px auto;
        }
        
        .forecast-day-temp {
            font-size: 16px;
            font-weight: 500;
        }
        
        .forecast-day-temp-night {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .location-btn {
            background-color: var(--card-from);
            color: var(--text-primary);
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        
        .location-btn:hover {
            background-color: var(--card-to);
            transform: translateY(-2px);
        }
        
        .loading {
            display: none;
            margin: 40px auto;
        }
        
        .loading:after {
            content: " ";
            display: block;
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border-radius: 50%;
            border: 4px solid var(--card-from);
            border-color: var(--card-from) transparent var(--card-from) transparent;
            animation: loading 1.2s linear infinite;
        }
        
        @keyframes loading {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            display: none;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="location-btn" id="getLocation">

                    <div class="weather-details">
                        <div class="detail">

                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z"></path>

                            </svg>
                            <span class="detail-label">УФ-индекс</span>

                        </div>
                    </div>

                    <div class="forecast-section">
                        <h4 class="section-title">Прогноз на 3 дня</h4>
                        <div class="forecast-list" id="forecast">
                            <!-- Прогноз будет добавлен через JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Карточка с прогнозом на 10 дней -->
            <div class="card">
                <div class="card-pattern"></div>
                <div class="card-content">
                    <h4 class="section-title">Прогноз на 10 дней</h4>

                    <div class="forecast-tabs">
                        <div class="forecast-tab active">Подробный прогноз</div>
                        <div class="forecast-tab">На месяц</div>
                    </div>

                    <div class="forecast-scroll">
                        <div class="forecast-days" id="forecastDays">
                            <!-- Прогноз на 10 дней будет добавлен через JavaScript -->

            <!-- Карточка со световым днем -->

                    <div class="additional-info">

                            <div class="info-label">Магнитное поле</div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ваш API ключ OpenWeatherMap
        const apiKey = '98e9321e772a14d9cf84a628a393b078';

        // Глобальная переменная для хранения данных о погоде
        window.weatherData = null;

        // Элементы DOM
        const loadingEl = document.getElementById('loading');
        const weatherContentEl = document.getElementById('weatherContent');
        const errorMessageEl = document.getElementById('errorMessage');

        // Форматирование даты
        function formatDate(date) {
            const options = { day: 'numeric', month: 'long' };
            return date.toLocaleDateString('ru-RU', options);
        }
// Добавьте эту функцию в начало скрипта
function checkElements() {
    const forecastDaysEl = document.getElementById('forecastDays');
    if (!forecastDaysEl) {
        console.error('Элемент forecastDays не найден!');
    } else {
        console.log('Элемент forecastDays найден, стили:',
            window.getComputedStyle(forecastDaysEl).display,
            window.getComputedStyle(forecastDaysEl).visibility);
    }
}

// Вызовите эту функцию после загрузки страницы
document.addEventListener('DOMContentLoaded', checkElements);
        // Форматирование времени
        function formatTime(date) {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        // Установка текущей даты и времени
        const currentDate = new Date();
        document.getElementById('date').textContent = formatDate(currentDate);
        document.getElementById('currentTime').textContent = formatTime(currentDate);

        // Обновление времени каждую минуту
        setInterval(() => {
            const now = new Date();
            document.getElementById('currentTime').textContent = formatTime(now);
        }, 60000);

        document.getElementById('getLocation').addEventListener('click', () => {
            if (navigator.geolocation) {
                showLoading();
                hideError();
                navigator.geolocation.getCurrentPosition(successCallback, errorCallback);
            } else {
                showError('Геолокация не поддерживается вашим браузером');
            }
        });

        function successCallback(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            fetchCurrentWeather(lat, lon);
            fetchForecast(lat, lon);
        }

        function errorCallback(error) {
            hideLoading();
            showError('Ошибка при получении местоположения: ' + error.message);
        }

        function fetchCurrentWeather(lat, lon) {
            const url = `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=ru`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    displayCurrentWeather(data);
                    hideLoading();
                    weatherContentEl.style.display = 'block';
                })
                .catch(error => {
                    console.error('Error fetching current weather:', error);
                    hideLoading();
                    showError('Ошибка при получении данных о текущей погоде. Попробуйте позже.');
                });
        }

function fetchForecast(lat, lon) {
    const url = `https://api.openweathermap.org/data/2.5/onecall?lat= ${lat}&lon=${lon}&exclude=minutely&appid=${apiKey}&units=metric&lang=ru`;
    fetch(url)
        .then(response => response.json())
        .then(data => {
            console.log('Полученные данные:', data); // Отладка
            window.weatherData = data;
            displayForecast(data.daily);
            displayExtendedForecast(data.daily);
            displaySunriseSunset(data.current.sunrise, data.current.sunset);
            displayUVIndex(data.current.uvi);
        })
        .catch(error => {
            console.error('Ошибка получения прогноза:', error);
            fetchFallbackForecast(lat, lon);
        });
}

        function fetchFallbackForecast(lat, lon) {
            const url = `https://api.openweathermap.org/data/2.5/forecast?lat=${lat}&lon=${lon}&appid=${apiKey}&units=metric&lang=ru`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    // Преобразуем 5-дневный прогноз по 3 часа в дневной прогноз
                    const dailyData = processForecastData(data.list);
                    displayForecast(dailyData);
                    displayExtendedForecast(dailyData);
                })
                .catch(error => {
                    console.error('Error fetching fallback forecast:', error);
                });
        }

        function processForecastData(forecastList) {
            const dailyForecasts = {};

            forecastList.forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toISOString().split('T')[0];
                const hour = date.getHours();

                if (!dailyForecasts[day]) {
                    dailyForecasts[day] = {
                        dt: item.dt,
                        temp: { day: 0, night: 0 }, // Начальные значения
                        weather: item.weather[0]
                    };
                }

                // Дневная температура (12:00 - 15:00)
                if (hour >= 12 && hour <= 15) {
                    dailyForecasts[day].temp.day = item.main.temp;
                }

                // Ночная температура (00:00 - 03:00)
                if (hour >= 0 && hour <= 3) {
                    dailyForecasts[day].temp.night = item.main.temp;
                }
            });

            // Преобразуем объект в массив и сортируем по дате
            return Object.values(dailyForecasts).sort((a, b) => a.dt - b.dt);
        }

        function displayCurrentWeather(data) {
            try {
                // Город
                document.getElementById('city').textContent = data.name;

                // Температура
                const tempC = Math.round(data.main.temp);
                document.getElementById('temp').textContent = tempC;

                // Описание погоды
                document.getElementById('description').textContent = data.weather[0].description;

                // Влажность
                document.getElementById('humidity').textContent = `${data.main.humidity}%`;

                // Ветер
                const windSpeed = Math.round(data.wind.speed);
                document.getElementById('wind').textContent = `${windSpeed} м/с`;

                // Давление (переводим из гПа в мм рт.ст.)
                const pressureMm = Math.round(data.main.pressure * 0.750062);
                document.getElementById('pressure').textContent = `${pressureMm} мм`;

                // Иконка погоды
                const iconCode = data.weather[0].icon;
                const iconUrl = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
                document.getElementById('weatherIcon').src = iconUrl;

                // Восход и закат
                displaySunriseSunset(data.sys.sunrise, data.sys.sunset);

                // Обновляем фон в зависимости от погоды и времени суток
                // Проверяем, день сейчас или ночь по иконке погоды
                const isDay = iconCode.includes('d');
                updateBackground(data.weather[0].id, isDay);
            } catch (error) {
                console.error('Error displaying weather data:', error);
                showError('Ошибка при отображении данных о погоде');
            }
        }

        function displayForecast(dailyData) {
            const forecastEl = document.getElementById('forecast');
            forecastEl.innerHTML = '';

            // Показываем прогноз на 3 дня, начиная с завтрашнего дня
            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

            // Создаем элементы прогноза, начиная с завтрашнего дня (индекс 1)
            for (let i = 1; i < Math.min(4, dailyData.length); i++) {
                const forecast = dailyData[i];
                let dayName;

                if (i === 1) {
                    dayName = 'Завтра';
                } else {
                    const forecastDate = new Date(forecast.dt * 1000);
                    const dayOfWeek = days[forecastDate.getDay()];
                    const dayOfMonth = forecastDate.getDate();
                    const month = months[forecastDate.getMonth()];
                    dayName = `${dayOfWeek}, ${dayOfMonth} ${month}`;
                }

                // Извлекаем температуру
                const tempDay = Math.round(forecast.temp.day);
                const tempNight = Math.round(forecast.temp.night);

                // Извлекаем иконку
                const iconCode = forecast.weather[0].icon;

                let iconSvg;

                // Выбираем SVG иконку в зависимости от погоды
                if (iconCode.includes('01')) {
                    // Ясно
                    iconSvg = `<svg class="forecast-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"></path>
                    </svg>`;
                } else if (iconCode.includes('02') || iconCode.includes('03') || iconCode.includes('04')) {
                    // Облачно
                    iconSvg = `<svg class="forecast-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.5 9.75a6 6 0 0111.573-2.226 3.75 3.75 0 014.133 4.303A4.5 4.5 0 0118 20.25H6.75a5.25 5.25 0 01-2.23-10.004 6.072 6.072 0 01-.02-.496z" clip-rule="evenodd"></path>
                    </svg>`;
                } else {
                    // Дождь и другие осадки
                    iconSvg = `<svg class="forecast-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.5 9.75a6 6 0 0111.573-2.226 3.75 3.75 0 014.133 4.303A4.5 4.5 0 0118 20.25H6.75a5.25 5.25 0 01-2.23-10.004 6.072 6.072 0 01-.02-.496z" clip-rule="evenodd"></path>
                    </svg>`;
                }

                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <span class="forecast-day">${dayName}</span>
                    <div class="forecast-right">
                        ${iconSvg}
                        <div class="forecast-temps">
                            <span class="forecast-temp-low">${tempNight}°</span>
                            <span class="forecast-temp-high">${tempDay}°</span>
                        </div>
                    </div>
                `;

                forecastEl.appendChild(forecastItem);
            }
        }

        function displayExtendedForecast(dailyData) {
    const forecastDaysEl = document.getElementById('forecastDays');

    // Очищаем содержимое
    forecastDaysEl.innerHTML = '';

    // Проверяем, есть ли данные
    if (!dailyData || dailyData.length === 0) {
        console.error('Нет данных о прогнозе');
        forecastDaysEl.innerHTML = '<div style="text-align: center; padding: 20px; color: white;">Нет данных о прогнозе</div>';
        return;
    }

    console.log('Данные прогноза:', dailyData);

    const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

    // Показываем прогноз на все доступные дни (включая сегодня)
    for (let i = 0; i < dailyData.length; i++) {
        const forecast = dailyData[i];

        // Проверяем структуру данных
        if (!forecast || !forecast.dt) {
            console.error('Некорректные данные прогноза:', forecast);
            continue;
        }

        const forecastDate = new Date(forecast.dt * 1000);

        let dayName;
        if (i === 0) {
            dayName = 'Сегодня';
        } else if (i === 1) {
            dayName = 'Завтра';
        } else {
            dayName = days[forecastDate.getDay()];
        }

        const dateStr = `${forecastDate.getDate()} ${months[forecastDate.getMonth()]}`;

        // Извлекаем температуру с проверкой
        let tempDay, tempNight;

        if (forecast.temp) {
            if (typeof forecast.temp === 'object') {
                tempDay = Math.round(forecast.temp.day || 0);
                tempNight = Math.round(forecast.temp.night || 0);
            } else {
                tempDay = Math.round(forecast.temp);
                tempNight = Math.round(forecast.temp - 5); // Примерная ночная температура
            }
        } else {
            tempDay = 0;
            tempNight = 0;
            console.error('Нет данных о температуре:', forecast);
        }

        // Извлекаем иконку с проверкой
        let iconCode = '01d'; // Значение по умолчанию

        if (forecast.weather && forecast.weather.length > 0) {
            iconCode = forecast.weather[0].icon || iconCode;
        } else if (forecast.weather && forecast.weather.icon) {
            iconCode = forecast.weather.icon;
        }

        const iconUrl = `https://openweathermap.org/img/wn/${iconCode}.png`;

        const forecastDayItem = document.createElement('div');
        forecastDayItem.className = 'forecast-day-item';
        forecastDayItem.innerHTML = `
            <div class="forecast-day-name">${dayName}</div>
            <div class="forecast-day-date">${dateStr}</div>
            <img class="forecast-day-icon" src="${iconUrl}" alt="Погода">
            <div class="forecast-day-temp">днём ${tempDay}°</div>
            <div class="forecast-day-temp-night">ночью ${tempNight}°</div>
        `;

        forecastDaysEl.appendChild(forecastDayItem);
    }

    // Проверяем, добавились ли элементы
    if (forecastDaysEl.children.length === 0) {
        forecastDaysEl.innerHTML = '<div style="text-align: center; padding: 20px; color: white;">Не удалось отобразить прогноз</div>';
    }
}

        function displaySunriseSunset(sunrise, sunset) {
            const sunriseTime = formatTime(new Date(sunrise * 1000));
            const sunsetTime = formatTime(new Date(sunset * 1000));

            document.getElementById('sunriseTime').textContent = sunriseTime;
            document.getElementById('sunsetTime').textContent = sunsetTime;

            // Рассчитываем продолжительность светового дня
            const daylightSeconds = sunset - sunrise;
            const daylightHours = Math.floor(daylightSeconds / 3600);
            const daylightMinutes = Math.floor((daylightSeconds % 3600) / 60);

            document.getElementById('daylightTime').textContent = `${daylightHours} ч ${daylightMinutes} мин`;

            // Устанавливаем фазу луны (упрощенно)
            const moonPhases = ['Новолуние', 'Растущая луна', 'Первая четверть', 'Растущая луна',
                               'Полнолуние', 'Убывающая луна', 'Последняя четверть', 'Убывающая луна'];
            const dayOfMonth = new Date().getDate();
            const moonPhaseIndex = Math.floor((dayOfMonth % 30) / 3.75);

            document.getElementById('moonPhase').textContent = moonPhases[moonPhaseIndex];
            document.getElementById('magneticField').textContent = 'Спокойное';
        }

        function displayUVIndex(uvIndex) {
            let uvLevel = uvIndex ? Math.round(uvIndex) : 0;
            document.getElementById('uvIndex').textContent = uvLevel;
        }

        function updateBackground(weatherId, isDay) {
            let gradientFrom, gradientTo;

            // Определяем цвета градиента в зависимости от погоды и времени суток
            if (isDay) {
                // Дневные градиенты
                if (weatherId >= 200 && weatherId < 300) {
                    // Гроза
                    gradientFrom = '#2c3e50';
                    gradientTo = '#4ca1af';
                } else if (weatherId >= 300 && weatherId < 500) {
                    // Морось
                    gradientFrom = '#5d6d7e';
                    gradientTo = '#a5b1c2';
                } else if (weatherId >= 500 && weatherId < 600) {
                    // Дождь
                    gradientFrom = '#3e5151';
                    gradientTo = '#a4b3b6';
                } else if (weatherId >= 600 && weatherId < 700) {
                    // Снег
                    gradientFrom = '#8e9eab';
                    gradientTo = '#eef2f3';
                } else if (weatherId >= 700 && weatherId < 800) {
                    // Туман
                    gradientFrom = '#7f7fd5';
                    gradientTo = '#91eae4';
                } else if (weatherId === 800) {
                    // Ясно
                    gradientFrom = '#2193b0';
                    gradientTo = '#6dd5ed';
                } else if (weatherId > 800 && weatherId < 803) {
                    // Небольшая облачность
                    gradientFrom = '#4b79a1';
                    gradientTo = '#79c1f1';
                } else {
                    // Сильная облачность
                    gradientFrom = '#606c88';
                    gradientTo = '#8e9eab';
                }
            } else {
                // Ночные градиенты
                if (weatherId >= 200 && weatherId < 300) {
                    // Гроза
                    gradientFrom = '#0f0c29';
                    gradientTo = '#302b63';
                } else if (weatherId >= 300 && weatherId < 500) {
                    // Морось
                    gradientFrom = '#2c3e50';
                    gradientTo = '#4b6cb7';
                } else if (weatherId >= 500 && weatherId < 600) {
                    // Дождь
                    gradientFrom = '#1f1c2c';
                    gradientTo = '#4b6cb7';
                } else if (weatherId >= 600 && weatherId < 700) {
                    // Снег
                    gradientFrom = '#243949';
                    gradientTo = '#517fa4';
                } else if (weatherId >= 700 && weatherId < 800) {
                    // Туман
                    gradientFrom = '#2c3e50';
                    gradientTo = '#3498db';
                } else if (weatherId === 800) {
                    // Ясно
                    gradientFrom = '#0f2027';
                    gradientTo = '#203a43';
                } else {
                    // Облачно
                    gradientFrom = '#232526';
                    gradientTo = '#414345';
                }
            }

            // Применяем градиент ко всем карточкам
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.style.background = `linear-gradient(to bottom, ${gradientFrom}, ${gradientTo})`;
            });
        }

        // Вспомогательные функции
        function showLoading() {
            loadingEl.style.display = 'block';
        }

        function hideLoading() {
            loadingEl.style.display = 'none';
        }

        function showError(message) {
            errorMessageEl.textContent = message;
            errorMessageEl.style.display = 'block';
        }

        function hideError() {
            errorMessageEl.style.display = 'none';
        }

        // Обработчики для вкладок прогноза
        // Обработчики для вкладок прогноза
const forecastTabs = document.querySelectorAll('.forecast-tab');
const forecastContent = document.createElement('div');
forecastContent.id = 'monthly-forecast';
forecastContent.style.display = 'none';
forecastContent.innerHTML = '<p style="text-align: center; padding: 20px;">Прогноз на месяц доступен в премиум-версии</p>';
document.querySelector('.forecast-scroll').appendChild(forecastContent);

forecastTabs.forEach((tab, index) => {
    tab.addEventListener('click', () => {
        // Удаляем активный класс со всех вкладок
        forecastTabs.forEach(t => t.classList.remove('active'));

        // Добавляем активный класс выбранной вкладке
        tab.classList.add('active');

        // Переключаем содержимое в зависимости от выбранной вкладки
        if (index === 0) {
            // Подробный прогноз - показываем прогноз на 10 дней
            document.getElementById('forecastDays').style.display = 'flex';
            document.getElementById('monthly-forecast').style.display = 'none';
        } else {
            // На месяц - показываем сообщение о премиум-версии
            document.getElementById('forecastDays').style.display = 'none';
            document.getElementById('monthly-forecast').style.display = 'block';
        }
    });
});
