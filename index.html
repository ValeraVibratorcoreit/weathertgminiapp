<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Прогноз погоды</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --card-from: #3b82f6;
            --card-to: #4f46e5;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-tertiary: rgba(255, 255, 255, 0.6);
            --card-overlay: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }
        
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        
        .card {
            width: 100%;
            background: linear-gradient(to bottom, var(--card-from), var(--card-to));
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            box-shadow: var(--card-shadow);
            transition: all 0.3s ease;
            margin-bottom: 16px;
        }
        
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.25);
        }
        
        .card-pattern {
            position: absolute;
            inset: 0;
            background-image: url('data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%23ffffff%22%20stroke-width%3D%221%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cpath%20d%3D%22M20%2016.2A4.5%204.5%200%200017.5%208h-1.8A7%207%200%104%2014.9%22%2F%3E%3Cpath%20d%3D%22M12%2012v9%22%2F%3E%3Cpath%20d%3D%22M8%2017l4%204%22%2F%3E%3Cpath%20d%3D%22M16%2017l-4%204%22%2F%3E%3C%2Fsvg%3E');
            background-position: center;
            opacity: 0.05;
        }
        
        .card-content {
            position: relative;
            padding: 24px;
        }
        
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .location {
            display: flex;
            flex-direction: column;
        }
        
        .city {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .date {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .time {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .temp-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
        }
        
        .temp-display {
            display: flex;
            align-items: flex-start;
        }
        
        .temp {
            font-size: 64px;
            font-weight: 700;
            line-height: 1;
            color: var(--text-primary);
        }
        
        .temp-unit {
            font-size: 24px;
            color: var(--text-secondary);
            margin-top: 4px;
            margin-left: 2px;
        }
        
        .weather-icon-container {
            position: relative;
        }
        
        .icon-glow {
            position: absolute;
            inset: -16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            filter: blur(16px);
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .card:hover .icon-glow {
            opacity: 0.75;
        }
        
        .weather-icon {
            position: relative;
            width: 64px;
            height: 64px;
            color: var(--text-primary);
        }
        
        .description {
            font-size: 16px;
            color: var(--text-secondary);
            margin-top: 8px;
            text-align: left;
        }
        
        .weather-details {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 32px;
            background: var(--card-overlay);
            border-radius: 12px;
            padding: 16px;
            backdrop-filter: blur(4px);
        }
        
        .detail {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }
        
        .detail-icon {
            width: 24px;
            height: 24px;
            color: var(--text-secondary);
        }
        
        .detail-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .detail-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 16px;
            text-align: left;
            width: 100%;
        }
        
        .forecast-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        
        .forecast-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-overlay);
            border-radius: 12px;
            padding: 12px 16px;
            backdrop-filter: blur(4px);
        }
        
        .forecast-day {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        .forecast-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .forecast-icon {
            width: 24px;
            height: 24px;
            color: var(--text-primary);
        }
        
        .forecast-temps {
            display: flex;
            gap: 8px;
        }
        
        .forecast-temp-low {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .forecast-temp-high {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .daylight-container {
            margin-top: 16px;
            width: 100%;
        }
        
        .daylight-diagram {
            position: relative;
            width: 100%;
            height: 120px;
            margin-top: 16px;
        }
        
        .daylight-arc {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-top: 2px dashed var(--card-overlay);
            border-radius: 50% 50% 0 0;
        }
        
        .earth-icon {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 40px;
            height: 40px;
            opacity: 0.8;
        }
        
        .sun-icon {
            position: absolute;
            width: 24px;
            height: 24px;
            color: var(--text-primary);
        }
        
        .sunrise-time, .sunset-time {
            position: absolute;
            bottom: -25px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        .sunrise-time {
            left: 10px;
        }
        
        .sunset-time {
            right: 10px;
        }
        
        .daylight-time {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 24px;
        }
        
        .additional-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 24px;
        }
        
        .info-item {
            background: var(--card-overlay);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            backdrop-filter: blur(4px);
        }
        
        .info-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .forecast-tabs {
            display: flex;
            overflow-x: auto;
            gap: 8px;
            margin-bottom: 16px;
            scrollbar-width: none;
            -ms-overflow-style: none;
            width: 100%;
        }
        
        .forecast-tabs::-webkit-scrollbar {
            display: none;
        }
        
        .forecast-tab {
            padding: 8px 16px;
            background: var(--card-overlay);
            border-radius: 20px;
            font-size: 14px;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            backdrop-filter: blur(4px);
        }
        
        .forecast-tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-primary);
        }
        
        .forecast-scroll {
            width: 100%;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
            margin-top: 16px;
        }
        
        .forecast-scroll::-webkit-scrollbar {
            display: none;
        }
        
        .forecast-days {
            display: flex;
            padding: 8px 0;
            min-width: max-content;
        }
        
        .forecast-day-item {
            flex: 0 0 auto;
            text-align: center;
            padding: 16px;
            min-width: 90px;
            background: var(--card-overlay);
            margin-right: 10px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
        }
        
        .forecast-day-name {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        
        .forecast-day-date {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .forecast-day-icon {
            width: 40px;
            height: 40px;
            margin: 8px auto;
        }
        
        .forecast-day-temp {
            font-size: 16px;
            font-weight: 500;
        }
        
        .forecast-day-temp-night {
            font-size: 14px;
            color: var(--text-secondary);
            margin-top: 4px;
        }
        
        .location-btn {
            background-color: var(--card-from);
            color: var(--text-primary);
            border: none;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }
        
        .location-btn:hover {
            background-color: var(--card-to);
            transform: translateY(-2px);
        }
        
        .loading {
            display: none;
            margin: 40px auto;
        }
        
        .loading:after {
            content: " ";
            display: block;
            width: 40px;
            height: 40px;
            margin: 0 auto;
            border-radius: 50%;
            border: 4px solid var(--card-from);
            border-color: var(--card-from) transparent var(--card-from) transparent;
            animation: loading 1.2s linear infinite;
        }
        
        @keyframes loading {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error-message {
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            padding: 16px;
            border-radius: 12px;
            margin: 20px 0;
            display: none;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="location-btn" id="getLocation">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2C8.13 2 5 5.13 5 9C5 14.25 12 22 12 22C12 22 19 14.25 19 9C19 5.13 15.87 2 12 2ZM12 11.5C10.62 11.5 9.5 10.38 9.5 9C9.5 7.62 10.62 6.5 12 6.5C13.38 6.5 14.5 7.62 14.5 9C14.5 10.38 13.38 11.5 12 11.5Z"></path>
            </svg>
            Поделиться местоположением
        </button>

        <div class="loading" id="loading"></div>
        <div class="error-message" id="errorMessage"></div>

        <div id="weatherContent" style="display: none;">
            <!-- Основная карточка погоды -->
            <div class="card">
                <div class="card-pattern"></div>
                <div class="card-content">
                    <div class="card-header">
                        <div class="location">
                            <h3 class="city" id="city">Загрузка...</h3>
                            <p class="date" id="date"></p>
                        </div>
                        <span class="time" id="currentTime"></span>
                    </div>

                    <div class="temp-container">
                        <div class="temp-display">
                            <span class="temp" id="temp">--</span>
                            <span class="temp-unit">°C</span>
                        </div>

                        <div class="weather-icon-container">
                            <div class="icon-glow"></div>
                            <img class="weather-icon" id="weatherIcon" src="" alt="Погода">
                        </div>
                    </div>

                    <div class="description" id="description">Загрузка...</div>

                    <div class="weather-details">
                        <div class="detail">
                            <svg class="detail-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path>
                            </svg>
                            <span class="detail-label">Влажность</span>
                            <span class="detail-value" id="humidity">--%</span>
                        </div>

                        <div class="detail">
                            <svg class="detail-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z"></path>
                            </svg>
                            <span class="detail-label">Ветер</span>
                            <span class="detail-value" id="wind">-- м/с</span>
                        </div>

                        <div class="detail">
                            <svg class="detail-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z"></path>
                            </svg>
                            <span class="detail-label">УФ-индекс</span>
                            <span class="detail-value" id="uvIndex">--</span>
                        </div>
                    </div>

                    <div class="forecast-section">
                        <h4 class="section-title">Прогноз на 3 дня</h4>
                        <div class="forecast-list" id="forecast">
                            <!-- Прогноз будет добавлен через JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Карточка с прогнозом на 10 дней -->
            <div class="card">
                <div class="card-pattern"></div>
                <div class="card-content">
                    <h4 class="section-title">Прогноз на 10 дней</h4>

                    <div class="forecast-tabs">
                        <div class="forecast-tab active">Подробный прогноз</div>
                        <div class="forecast-tab">На месяц</div>
                    </div>

                    <div class="forecast-scroll">
                        <div class="forecast-days" id="forecastDays">
                            <!-- Прогноз на 10 дней будет добавлен через JavaScript -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Карточка со световым днем -->
            <div class="card">
                <div class="card-pattern"></div>
                <div class="card-content">
                    <h4 class="section-title">Световой день</h4>

                    <div class="daylight-time" id="daylightTime">-- ч -- мин</div>

                    <div class="daylight-diagram">
                        <div class="daylight-arc"></div>
                        <img class="earth-icon" src="https://cdn-icons-png.flaticon.com/512/616/616616.png" alt="Земля">

                        <svg class="sun-icon" style="left: 10px; bottom: 10px;" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"></path>
                        </svg>

                        <svg class="sun-icon" style="right: 10px; bottom: 10px;" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2.25a.75.75 0 01.75.75v2.25a.75.75 0 01-1.5 0V3a.75.75 0 01.75-.75zM7.5 12a4.5 4.5 0 119 0 4.5 4.5 0 01-9 0zM18.894 6.166a.75.75 0 00-1.06-1.06l-1.591 1.59a.75.75 0 101.06 1.061l1.591-1.59zM21.75 12a.75.75 0 01-.75.75h-2.25a.75.75 0 010-1.5H21a.75.75 0 01.75.75zM17.834 18.894a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 10-1.061 1.06l1.59 1.591zM12 18a.75.75 0 01.75.75V21a.75.75 0 01-1.5 0v-2.25A.75.75 0 0112 18zM7.758 17.303a.75.75 0 00-1.061-1.06l-1.591 1.59a.75.75 0 001.06 1.061l1.591-1.59zM6 12a.75.75 0 01-.75.75H3a.75.75 0 010-1.5h2.25A.75.75 0 016 12zM6.697 7.757a.75.75 0 001.06-1.06l-1.59-1.591a.75.75 0 00-1.061 1.06l1.59 1.591z"></path>
                        </svg>

                        <div class="sunrise-time" id="sunriseTime">--:--</div>
                        <div class="sunset-time" id="sunsetTime">--:--</div>
                    </div>

                    <div class="additional-info">
                        <div class="info-item">
                            <div class="info-label">Фаза луны</div>
                            <div class="info-value" id="moonPhase">Растущая</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Магнитное поле</div>
                            <div class="info-value" id="magneticField">Спокойное</div>
                        </div>
                        <div class="info-item">
                            <div class="info-label">Давление</div>
                            <div class="info-value" id="pressure">-- мм</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ваш API ключ WeatherAPI
        const apiKey = '133872561d43482780a151135251605';

        // Глобальная переменная для хранения данных о погоде
        window.weatherData = null;

        // Элементы DOM
        const loadingEl = document.getElementById('loading');
        const weatherContentEl = document.getElementById('weatherContent');
        const errorMessageEl = document.getElementById('errorMessage');
        const getLocationBtn = document.getElementById('getLocation');

        // Форматирование даты
        function formatDate(date) {
            const options = { day: 'numeric', month: 'long' };
            return date.toLocaleDateString('ru-RU', options);
        }

        // Форматирование времени
        function formatTime(date) {
            return date.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
        }

        // Установка текущей даты и времени
        const currentDate = new Date();
        document.getElementById('date').textContent = formatDate(currentDate);
        document.getElementById('currentTime').textContent = formatTime(currentDate);

        // Обновление времени каждую минуту
        setInterval(() => {
            const now = new Date();
            document.getElementById('currentTime').textContent = formatTime(now);
        }, 60000);

        document.getElementById('getLocation').addEventListener('click', () => {
            if (navigator.geolocation) {
                showLoading();
                hideError();
                navigator.geolocation.getCurrentPosition(successCallback, errorCallback);
            } else {
                showError('Геолокация не поддерживается вашим браузером');
            }
        });

        function successCallback(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            fetchCurrentWeather(lat, lon);
            fetchForecast(lat, lon);
        }

        function errorCallback(error) {
            hideLoading();
            showError('Ошибка при получении местоположения: ' + error.message);
        }

        function fetchCurrentWeather(lat, lon) {
            const url = `https://api.weatherapi.com/v1/current.json?key=${apiKey}&q=${lat},${lon}&lang=ru`;

            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    displayCurrentWeather(data);
                    // Данные для восхода/заката и УФ-индекса теперь получаем из forecast API
                    // hideLoading() и weatherContentEl.style.display = 'block' будут вызываться в fetchForecast
                })
                .catch(error => {
                    console.error('Error fetching current weather:', error);
                    hideLoading();
                    showError('Ошибка при получении данных о текущей погоде. Попробуйте позже.');
                });
        }

        function fetchForecast(lat, lon) {
            // Для бесплатного ключа WeatherAPI доступен прогноз на 3 дня
            const url = `https://api.weatherapi.com/v1/forecast.json?key=${apiKey}&q=${lat},${lon}&days=3&lang=ru&aqi=no&alerts=no`;
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! Status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('Полученные данные WeatherAPI:', data); // Отладка
                    window.weatherData = data; // Сохраняем все данные, чтобы displayCurrentWeather мог их использовать

                    // Отображаем текущую погоду, используя данные из forecast ответа, т.к. он содержит и current, и forecast
                    displayCurrentWeather(data); 
                    
                    displayForecast(data.forecast.forecastday);
                    displayExtendedForecast(data.forecast.forecastday); // Используем тот же прогноз на 3 дня
                    
                    // Восход/закат берем из первого дня прогноза
                    if (data.forecast && data.forecast.forecastday && data.forecast.forecastday.length > 0) {
                        displaySunriseSunset(data.forecast.forecastday[0].astro.sunrise, data.forecast.forecastday[0].astro.sunset, data.location.localtime_epoch);
                    }
                    // УФ-индекс из текущей погоды
                    displayUVIndex(data.current.uv);
                    
                    hideLoading();
                    weatherContentEl.style.display = 'block';
                    getLocationBtn.style.display = 'none';
                })
                .catch(error => {
                    console.error('Ошибка получения прогноза WeatherAPI:', error);
                    // fetchFallbackForecast(lat, lon); // Пока уберем fallback, т.к. он для OpenWeatherMap
                    hideLoading();
                    showError('Ошибка при получении данных о прогнозе погоды. Попробуйте позже.');
                });
        }

        function displayCurrentWeather(data) {
            try {
                // Используем данные из data.location и data.current
                const location = data.location;
                const current = data.current;

                // Город
                document.getElementById('city').textContent = location.name;

                // Температура
                const tempC = Math.round(current.temp_c);
                document.getElementById('temp').textContent = tempC;

                // Описание погоды
                document.getElementById('description').textContent = current.condition.text;

                // Влажность
                document.getElementById('humidity').textContent = `${current.humidity}%`;

                // Ветер (WeatherAPI дает в км/ч, переводим в м/с)
                const windSpeedKph = current.wind_kph;
                const windSpeedMps = Math.round(windSpeedKph / 3.6);
                document.getElementById('wind').textContent = `${windSpeedMps} м/с`;

                // Давление (WeatherAPI дает в миллибарах (гПа), переводим в мм рт.ст.)
                const pressureMb = current.pressure_mb;
                const pressureMm = Math.round(pressureMb * 0.750062);
                document.getElementById('pressure').textContent = `${pressureMm} мм`;

                // Иконка погоды (WeatherAPI предоставляет URL)
                // Убедимся, что URL начинается с https:
                let iconUrl = current.condition.icon;
                if (iconUrl.startsWith('//')) {
                    iconUrl = 'https:' + iconUrl;
                }
                document.getElementById('weatherIcon').src = iconUrl;
                
                // Обновляем фон в зависимости от погоды и времени суток
                // WeatherAPI предоставляет is_day (1 - день, 0 - ночь)
                // И код состояния погоды current.condition.code
                updateBackground(current.condition.code, current.is_day === 1);

            } catch (error) {
                console.error('Error displaying weather data:', error);
                showError('Ошибка при отображении данных о погоде');
            }
        }

        function displayForecast(forecastDays) { // forecastDays это data.forecast.forecastday
            const forecastEl = document.getElementById('forecast');
            forecastEl.innerHTML = '';

            const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
            const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

            // Показываем прогноз на следующие дни (пропускаем сегодняшний, если он есть в массиве, обычно WeatherAPI отдает начиная с текущего дня)
            // Если первый элемент - сегодня, начинаем с i = 1. Если уже завтра - с i = 0.
            // Для WeatherAPI forecastday[0] - это сегодня. Нам нужен прогноз со следующего дня для этого блока.
            // Бесплатный API дает 3 дня, включая сегодняшний. Значит, выводим [1] и [2] элементы.
            for (let i = 1; i < forecastDays.length; i++) { 
                const forecast = forecastDays[i];
                const forecastDate = new Date(forecast.date_epoch * 1000);
                let dayName;

                if (i === 1 && new Date(forecastDays[0].date_epoch * 1000).toDateString() === new Date().toDateString()) {
                     // Если forecastDays[0] это сегодня, то forecastDays[1] это завтра
                    dayName = 'Завтра';
                } else if (i === 0 && new Date(forecast.date_epoch * 1000).toDateString() !== new Date().toDateString()){
                    // Если API вернуло массив уже с завтрашнего дня
                     dayName = 'Завтра';
                }
                else {
                    const dayOfWeek = days[forecastDate.getDay()];
                    const dayOfMonth = forecastDate.getDate();
                    const month = months[forecastDate.getMonth()];
                    dayName = `${dayOfWeek}, ${dayOfMonth} ${month}`;
                }

                const tempDay = Math.round(forecast.day.maxtemp_c);
                const tempNight = Math.round(forecast.day.mintemp_c);
                
                let iconUrl = forecast.day.condition.icon;
                if (iconUrl.startsWith('//')) {
                    iconUrl = 'https:' + iconUrl;
                }

                // Используем img тэг для иконок WeatherAPI
                const iconHtml = `<img class="forecast-icon" src="${iconUrl}" alt="${forecast.day.condition.text}">`;

                const forecastItem = document.createElement('div');
                forecastItem.className = 'forecast-item';
                forecastItem.innerHTML = `
                    <span class="forecast-day">${dayName}</span>
                    <div class="forecast-right">
                        ${iconHtml}
                        <div class="forecast-temps">
                            <span class="forecast-temp-low">${tempNight}°</span>
                            <span class="forecast-temp-high">${tempDay}°</span>
                        </div>
                    </div>
                `;
                forecastEl.appendChild(forecastItem);
            }
        }

        function displayExtendedForecast(dailyData) { // dailyData это data.forecast.forecastday
    const forecastDaysEl = document.getElementById('forecastDays');
    forecastDaysEl.innerHTML = '';

    if (!dailyData || dailyData.length === 0) {
        console.error('Нет данных о прогнозе для displayExtendedForecast');
        forecastDaysEl.innerHTML = '<div style="text-align: center; padding: 20px; color: white;">Нет данных о прогнозе</div>';
        return;
    }

    const days = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
    const months = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

    // Показываем прогноз на все доступные дни (WeatherAPI возвращает 3 дня, включая сегодняшний)
    dailyData.forEach((forecast, i) => {
        const forecastDate = new Date(forecast.date_epoch * 1000);
        let dayName;

        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);

        if (forecastDate.toDateString() === today.toDateString()) {
            dayName = 'Сегодня';
        } else if (forecastDate.toDateString() === tomorrow.toDateString()) {
            dayName = 'Завтра';
        } else {
            dayName = days[forecastDate.getDay()];
        }

        const dateStr = `${forecastDate.getDate()} ${months[forecastDate.getMonth()]}`;
        const tempDay = Math.round(forecast.day.maxtemp_c);
        const tempNight = Math.round(forecast.day.mintemp_c);
        
        let iconUrl = forecast.day.condition.icon;
        if (iconUrl.startsWith('//')) {
            iconUrl = 'https:' + iconUrl;
        }

        const forecastDayItem = document.createElement('div');
        forecastDayItem.className = 'forecast-day-item';
        forecastDayItem.innerHTML = `
            <div class="forecast-day-name">${dayName}</div>
            <div class="forecast-day-date">${dateStr}</div>
            <img class="forecast-day-icon" src="${iconUrl}" alt="${forecast.day.condition.text}">
            <div class="forecast-day-temp">днём ${tempDay}°</div>
            <div class="forecast-day-temp-night">ночью ${tempNight}°</div>
        `;
        forecastDaysEl.appendChild(forecastDayItem);
    });

    if (forecastDaysEl.children.length === 0) {
        forecastDaysEl.innerHTML = '<div style="text-align: center; padding: 20px; color: white;">Не удалось отобразить прогноз</div>';
    }
}
        function displaySunriseSunset(sunriseStr, sunsetStr, localtimeEpoch) { // Новая функция для WeatherAPI
            // WeatherAPI возвращает время в формате "06:57 AM" или "16:30 PM"
            // Преобразуем это время в объект Date, используя текущую дату местоположения из localtimeEpoch
            
            const locationDate = new Date(localtimeEpoch * 1000);
            const currentYear = locationDate.getFullYear();
            const currentMonth = locationDate.getMonth(); // 0-11
            const currentDate = locationDate.getDate();

            const parseTime = (timeStr) => {
                const [time, modifier] = timeStr.split(' ');
                let [hours, minutes] = time.split(':').map(Number);
                if (modifier === 'PM' && hours < 12) hours += 12;
                if (modifier === 'AM' && hours === 12) hours = 0; // Полночь
                return new Date(currentYear, currentMonth, currentDate, hours, minutes);
            };

            const sunriseDate = parseTime(sunriseStr);
            const sunsetDate = parseTime(sunsetStr);

            const sunriseTime = formatTime(sunriseDate);
            const sunsetTime = formatTime(sunsetDate);

            document.getElementById('sunriseTime').textContent = sunriseTime;
            document.getElementById('sunsetTime').textContent = sunsetTime;

            // Рассчитываем продолжительность светового дня
            const daylightSeconds = (sunsetDate.getTime() - sunriseDate.getTime()) / 1000;
            const daylightHours = Math.floor(daylightSeconds / 3600);
            const daylightMinutes = Math.floor((daylightSeconds % 3600) / 60);

            document.getElementById('daylightTime').textContent = `${daylightHours} ч ${daylightMinutes} мин`;

            // Устанавливаем фазу луны (упрощенно)
            const moonPhases = ['Новолуние', 'Растущая луна', 'Первая четверть', 'Растущая луна',
                               'Полнолуние', 'Убывающая луна', 'Последняя четверть', 'Убывающая луна'];
            const dayOfMonth = new Date().getDate();
            const moonPhaseIndex = Math.floor((dayOfMonth % 30) / 3.75);

            document.getElementById('moonPhase').textContent = moonPhases[moonPhaseIndex];
            document.getElementById('magneticField').textContent = 'Спокойное'; // Заглушка, WeatherAPI не предоставляет эти данные в бесплатной версии
        }

        function displayUVIndex(uvIndex) {
            let uvLevel = uvIndex ? Math.round(uvIndex) : 0;
            document.getElementById('uvIndex').textContent = uvLevel;
        }

        function updateBackground(weatherCode, isDay) { // weatherCode из WeatherAPI, isDay (true/false)
            let gradientFrom, gradientTo;

            // Определяем цвета градиента в зависимости от погоды и времени суток
            // Коды погоды WeatherAPI: https://www.weatherapi.com/docs/weather_conditions.json
            if (isDay) {
                // Дневные градиенты
                if ([1000].includes(weatherCode)) { // Ясно
                    gradientFrom = '#2193b0'; 
                    gradientTo = '#6dd5ed';
                } else if ([1003].includes(weatherCode)) { // Частично облачно
                    gradientFrom = '#4b79a1';
                    gradientTo = '#79c1f1';
                } else if ([1006, 1009].includes(weatherCode)) { // Облачно, пасмурно
                    gradientFrom = '#606c88';
                    gradientTo = '#8e9eab';
                } else if ([1030, 1135, 1147].includes(weatherCode)) { // Туман, ледяной туман
                    gradientFrom = '#7f7fd5';
                    gradientTo = '#91eae4';
                } else if (weatherCode >= 1063 && weatherCode <= 1201 || weatherCode >= 1240 && weatherCode <= 1252) { // Дождь, морось (разные интенсивности)
                     gradientFrom = '#3e5151';
                     gradientTo = '#a4b3b6';
                } else if (weatherCode >= 1204 && weatherCode <= 1237 || weatherCode >= 1255 && weatherCode <= 1264) { // Снег, ледяной дождь (разные интенсивности)
                    gradientFrom = '#8e9eab';
                    gradientTo = '#eef2f3';
                } else if (weatherCode >= 1273 && weatherCode <= 1282) { // Гроза
                    gradientFrom = '#2c3e50';
                    gradientTo = '#4ca1af';
                }
                 else { // По умолчанию для дня
                    gradientFrom = '#4b79a1';
                    gradientTo = '#79c1f1';
                }
            } else {
                // Ночные градиенты
                if ([1000].includes(weatherCode)) { // Ясно
                    gradientFrom = '#0f2027';
                    gradientTo = '#203a43';
                } else if ([1003, 1006, 1009].includes(weatherCode)) { // Частично облачно, облачно, пасмурно
                    gradientFrom = '#232526';
                    gradientTo = '#414345';
                } else if ([1030, 1135, 1147].includes(weatherCode)) { // Туман, ледяной туман
                    gradientFrom = '#2c3e50';
                    gradientTo = '#3498db';
                } else if (weatherCode >= 1063 && weatherCode <= 1201 || weatherCode >= 1240 && weatherCode <= 1252) { // Дождь, морось
                    gradientFrom = '#1f1c2c';
                    gradientTo = '#4b6cb7';
                } else if (weatherCode >= 1204 && weatherCode <= 1237 || weatherCode >= 1255 && weatherCode <= 1264) { // Снег, ледяной дождь
                    gradientFrom = '#243949';
                    gradientTo = '#517fa4';
                } else if (weatherCode >= 1273 && weatherCode <= 1282) { // Гроза
                    gradientFrom = '#0f0c29';
                    gradientTo = '#302b63';
                }
                 else { // По умолчанию для ночи
                    gradientFrom = '#232526';
                    gradientTo = '#414345';
                }
            }

            // Применяем градиент ко всем карточкам
            const cards = document.querySelectorAll('.card');
            cards.forEach(card => {
                card.style.background = `linear-gradient(to bottom, ${gradientFrom}, ${gradientTo})`;
            });
        }

        // Вспомогательные функции
        function showLoading() {
            loadingEl.style.display = 'block';
        }

        function hideLoading() {
            loadingEl.style.display = 'none';
        }

        function showError(message) {
            errorMessageEl.textContent = message;
            errorMessageEl.style.display = 'block';
        }

        function hideError() {
            errorMessageEl.style.display = 'none';
        }

        // Обработчики для вкладок прогноза
        const forecastTabs = document.querySelectorAll('.forecast-tab');
        const forecastContent = document.createElement('div');
        forecastContent.id = 'monthly-forecast';
        forecastContent.style.display = 'none';
        forecastContent.innerHTML = '<p style="text-align: center; padding: 20px;">Прогноз на месяц доступен в премиум-версии</p>';
        document.querySelector('.forecast-scroll').appendChild(forecastContent);

        forecastTabs.forEach((tab, index) => {
            tab.addEventListener('click', () => {
                // Удаляем активный класс со всех вкладок
                forecastTabs.forEach(t => t.classList.remove('active'));

                // Добавляем активный класс выбранной вкладке
                tab.classList.add('active');

                // Переключаем содержимое в зависимости от выбранной вкладки
                if (index === 0) {
                    // Подробный прогноз - показываем прогноз на 10 дней
                    document.getElementById('forecastDays').style.display = 'flex';
                    document.getElementById('monthly-forecast').style.display = 'none';
                } else {
                    // На месяц - показываем сообщение о премиум-версии
                    document.getElementById('forecastDays').style.display = 'none';
                    document.getElementById('monthly-forecast').style.display = 'block';
                }
            });
        });
    </script>
